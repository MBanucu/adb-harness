name: emulator-e2e

# Post-merge proof that the package still talks to a real Android runtime. This
# is an attached-emulator smoke test, not a replacement for the self-hosted
# phone suite: the AVD is x86_64 google_apis, not the arm64 MediaTek device, and
# its encoder is not the vendor's. See "Emulator smoke test" in the README.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: attached-emulator smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot API 35 and run the attached-emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          avd-name: adb-harness-api35
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          script: bash tests/emulator.sh

      - name: Upload the recording and JSON when the smoke test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-e2e-${{ github.run_id }}
          path: out/emulator/
          if-no-files-found: warn
          retention-days: 7
